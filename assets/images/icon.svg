<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141a33"/>
      <stop offset="100%" stop-color="#0a0c16"/>
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bg-glow)"/>
  <rect width="512" height="512" rx="96" fill="none" stroke="#00f5d4" stroke-width="6" opacity="0.4"/>

  <!-- CRT Scanlines Pattern -->
  <g opacity="0.08">
    <line x1="0" y1="64" x2="512" y2="64" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="128" x2="512" y2="128" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="192" x2="512" y2="192" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="320" x2="512" y2="320" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="448" x2="512" y2="448" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Center Controller Shape -->
  <g transform="translate(96, 126)" filter="url(#neon-glow)">
    <!-- Controller Body -->
    <rect x="0" y="40" width="320" height="180" rx="40" fill="#1b213b" stroke="#00f5d4" stroke-width="8"/>

    <!-- Screen Bezel in Gamepad -->
    <rect x="95" y="70" width="130" height="120" rx="16" fill="#0b0e1b" stroke="#3a4768" stroke-width="4"/>
    <text x="160" y="138" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#00f5d4">PIXEL</text>
    <text x="160" y="162" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#fee440" letter-spacing="2">EMU</text>

    <!-- D-Pad Left -->
    <rect x="30" y="110" width="48" height="16" rx="4" fill="#fee440"/>
    <rect x="46" y="94" width="16" height="48" rx="4" fill="#fee440"/>

    <!-- Action Buttons Right -->
    <circle cx="260" cy="110" r="10" fill="#ff007f"/>
    <circle cx="280" cy="130" r="10" fill="#00f5d4"/>
    <circle cx="240" cy="130" r="10" fill="#fee440"/>
    <circle cx="260" cy="150" r="10" fill="#7928ca"/>

    <!-- Start / Select -->
    <rect x="125" y="196" width="30" height="8" rx="4" fill="#a0aec0"/>
    <rect x="165" y="196" width="30" height="8" rx="4" fill="#a0aec0"/>
  </g>
</svg>
